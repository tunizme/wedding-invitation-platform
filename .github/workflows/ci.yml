name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://wedding_ci:ci-only@127.0.0.1:5432/wedding_ci
  FRONTEND_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:web
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:api
      - run: pnpm lint:api
      - run: pnpm typecheck:api
      - run: pnpm test:api
      - run: pnpm build:api

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wedding_ci
          POSTGRES_USER: wedding_ci
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wedding_ci -d wedding_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wedding/api migration:run
      - run: pnpm build:api
      - run: node apps/api/scripts/with-test-iam.cjs pnpm validate:iam --phase all
        env:
          IAM_TEST_DATABASE_URL: postgresql://wedding_ci:ci-only@127.0.0.1:5432/wedding_ci
          DATABASE_HEALTH_MODE: direct
      - run: pnpm validate:iam:mail
        env:
          IAM_TEST_DATABASE_URL: postgresql://wedding_ci:ci-only@127.0.0.1:5432/wedding_ci
          IAM_TEST_MAILPIT_URL: http://127.0.0.1:8025
          IAM_SMTP_HOST: 127.0.0.1
          IAM_SMTP_PORT: 1025

  full-stack-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start full stack
        run: docker compose --profile ci up -d --build --wait
      - name: Check component health
        run: pnpm health
      - name: Diagnostics
        if: failure()
        run: docker compose --profile ci ps && docker compose --profile ci logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --profile ci down --volumes --remove-orphans

  responsive-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      IAM_TEST_DATABASE_URL: postgresql://wedding_local:local-development-only@127.0.0.1:55432/wedding_local
      BUILDER_TEST_DATABASE_URL: postgresql://wedding_local:local-development-only@127.0.0.1:55432/wedding_local
      POSTGRES_PORT: '55432'
      MINIO_ROOT_USER: frontend-ci-root
      MINIO_ROOT_PASSWORD: frontend-ci-root-local-only
      BUILDER_S3_ENDPOINT: http://127.0.0.1:9000
      BUILDER_S3_REGION: us-east-1
      BUILDER_S3_BUCKET: frontend-ci-development
      BUILDER_S3_PREFIX: development/
      BUILDER_S3_FORCE_PATH_STYLE: 'true'
      BUILDER_S3_ACCESS_KEY_ID: frontend-ci-development
      BUILDER_S3_SECRET_ACCESS_KEY: frontend-ci-development-local-only
      BUILDER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      BUILDER_TEST_S3_REGION: us-east-1
      BUILDER_TEST_S3_BUCKET: frontend-ci-test
      BUILDER_TEST_S3_FORCE_PATH_STYLE: 'true'
      BUILDER_TEST_S3_ACCESS_KEY_ID: frontend-ci-test
      BUILDER_TEST_S3_SECRET_ACCESS_KEY: frontend-ci-test-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose build minio
      - run: docker build --target client --tag wedding-builder-mc:2025-08-13 infra/minio
      - run: pnpm infra:up
      - run: pnpm builder:storage:init
      - run: pnpm --filter @wedding/web exec playwright install --with-deps chromium firefox webkit
      - run: node --test --test-isolation=none --test-timeout=30000 apps/api/scripts/validate-iam-contract.cjs
      - name: Responsive invitation acceptance
        run: node scripts/responsive-validate.mjs --phase all
        env:
          RESPONSIVE_TEST_BROWSER_MODE: native
      - name: Status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-acceptance-status
          path: |
            .artifacts/responsive/**/report.json
            .artifacts/responsive/**/cleanup.json
            .artifacts/responsive/**/publication-timing.jsonl
      - name: Cleanup owned CI infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
