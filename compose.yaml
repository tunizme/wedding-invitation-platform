name: ${COMPOSE_PROJECT_NAME:-wedding-foundation}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wedding_local}
      POSTGRES_USER: ${POSTGRES_USER:-wedding_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && grep -qx '1' /var/lib/postgresql/data/postmaster.pid",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  migrate:
    profiles: [ci]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wedding_local}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-wedding_local}
      FRONTEND_ORIGIN: http://web:3000
    command:
      [
        "node",
        "apps/api/node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "apps/api/dist/infrastructure/database/data-source.js",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [ci]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wedding_local}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-wedding_local}
      FRONTEND_ORIGIN: http://web:3000
      API_PORT: 3001
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [ci]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
      WEB_PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
