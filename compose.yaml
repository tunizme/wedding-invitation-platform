name: ${COMPOSE_PROJECT_NAME:-wedding-foundation}

services:
  minio:
    # Exact source releases/base digest and verified build outputs: infra/minio/images.lock.json.
    image: wedding-builder-minio:2025-10-15
    build:
      context: infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wedding-storage-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-27022003}
      MINIO_REGION_NAME: us-east-1
    ports:
      - '127.0.0.1:${MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', '/ready']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    stop_grace_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 20
    stop_grace_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wedding_local}
      POSTGRES_USER: ${POSTGRES_USER:-wedding_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && grep -qx '1' /var/lib/postgresql/data/postmaster.pid",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  init-infra:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wedding_local}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-wedding_local}
      BUILDER_S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wedding-storage-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-27022003}
      FRONTEND_ORIGIN: http://localhost:3000
    command: ['node', 'apps/api/scripts/docker-init.cjs']
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-wedding_local}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-wedding_local}
      FRONTEND_ORIGIN: http://localhost:3000
      API_PORT: 3001
      API_PUBLIC_ORIGIN: http://localhost:3001
      IAM_SMTP_HOST: mailpit
      IAM_SMTP_PORT: 1025
      BUILDER_S3_ENDPOINT: http://minio:9000
    command:
      [
        'node',
        'apps/api/scripts/with-test-iam.cjs',
        'node',
        'apps/api/dist/main.js',
      ]
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      init-infra:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3001}/api/v1
      WEB_PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
